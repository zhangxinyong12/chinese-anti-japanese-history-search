<!-- OG Image Template - 可以在线生成 https://www.opengraph.xyz/ -->
<!DOCTYPE html>
<html>
<head>
    <title>OG Image Generator</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 50%, #7f1d1d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .emoji {
            font-size: 120px;
            margin-bottom: 20px;
        }
        .title {
            color: #FFDE00;
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            margin: 20px 40px;
            line-height: 1.2;
        }
        .subtitle {
            color: white;
            font-size: 32px;
            text-align: center;
            margin: 20px 40px;
            opacity: 0.9;
        }
        .badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0,0,0,0.3);
            color: #FFDE00;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .year {
            position: absolute;
            bottom: 30px;
            color: white;
            font-size: 24px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">🇨🇳 历史教育工具</div>
        <div class="emoji">🇨🇳</div>
        <div class="title">日奸清算器</div>
        <div class="subtitle">中国抗日战争历史人物查询工具</div>
        <div class="year">1931-1945</div>
    </div>
</body>
</html>
