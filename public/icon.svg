<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#991b1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f1d1d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- China flag colors representation -->
  <rect x="50" y="180" width="412" height="8" fill="#FFDE00" opacity="0.9"/>
  <rect x="50" y="200" width="412" height="8" fill="#FFDE00" opacity="0.9"/>
  
  <!-- Historical book symbol -->
  <path d="M150 320 L150 400 L362 400 L362 320 Z" fill="#FFDE00" opacity="0.8"/>
  <rect x="160" y="330" width="192" height="60" fill="#7f1d1d"/>
  
  <!-- Year text -->
  <text x="256" y="140" font-family="Arial, sans-serif" font-size="48" fill="#FFDE00" text-anchor="middle" font-weight="bold">1931-1945</text>
  
  <!-- Search icon -->
  <circle cx="180" cy="280" r="40" stroke="#FFDE00" stroke-width="8" fill="none"/>
  <line x1="210" y1="310" x2="280" y2="380" stroke="#FFDE00" stroke-width="8" stroke-linecap="round"/>
</svg>